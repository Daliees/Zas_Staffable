<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Staffable HR — WhatsApp</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: #111b21;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Phone shell ── */
      .phone {
        width: 390px;
        height: 844px;
        background: #111b21;
        border-radius: 44px;
        box-shadow: 0 0 0 10px #1a1a2e, 0 30px 80px rgba(0,0,0,.8);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Status bar ── */
      .status-bar {
        background: #075e54;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px 4px;
        flex-shrink: 0;
      }
      .status-bar .time { font-size: 13px; font-weight: 700; }
      .status-icons { display: flex; gap: 5px; align-items: center; }
      .status-icons svg { width: 14px; height: 14px; fill: #fff; }

      /* ── WA Header ── */
      .wa-header {
        background: #075e54;
        color: #fff;
        padding: 8px 12px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .back-btn { font-size: 22px; opacity: .9; cursor: pointer; line-height: 1; }
      .avatar {
        width: 38px; height: 38px; border-radius: 50%;
        background: #25d366;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
      }
      .contact-info { flex: 1; min-width: 0; }
      .contact-name  { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .contact-sub   { font-size: 11px; opacity: .85; margin-top: 1px; }
      .header-icons  { display: flex; gap: 16px; }
      .header-icons svg { width: 20px; height: 20px; fill: #fff; opacity: .9; cursor: pointer; }

      /* ── Chat wallpaper ── */
      .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background-color: #0b141a;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fff' fill-opacity='.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
      }
      .chat-body::-webkit-scrollbar { width: 0; }

      /* ── Date chip ── */
      .date-chip { text-align: center; margin: 8px 0 6px; }
      .date-chip span {
        background: #1f2c34; color: #8696a0;
        font-size: 11px; padding: 4px 10px; border-radius: 7px;
      }

      /* ── Bubbles ── */
      .msg-row { display: flex; margin-bottom: 1px; }
      .msg-row.user  { justify-content: flex-end; }
      .msg-row.agent { justify-content: flex-start; }

      .bubble {
        max-width: 72%;
        padding: 7px 10px 4px;
        border-radius: 7.5px;
        font-size: 13.5px;
        line-height: 1.45;
        word-wrap: break-word;
        position: relative;
        animation: popIn .15s ease-out;
      }
      @keyframes popIn {
        from { transform: scale(.95); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      .msg-row.user .bubble {
        background: #005c4b; color: #e9edef;
        border-top-right-radius: 0;
      }
      .msg-row.user .bubble::after {
        content: ''; position: absolute; top: 0; right: -8px;
        border: 8px solid transparent;
        border-top-color: #005c4b; border-right: 0;
      }
      .msg-row.agent .bubble {
        background: #1f2c34; color: #e9edef;
        border-top-left-radius: 0;
      }
      .msg-row.agent .bubble::after {
        content: ''; position: absolute; top: 0; left: -8px;
        border: 8px solid transparent;
        border-top-color: #1f2c34; border-left: 0;
      }
      .bubble-footer {
        display: flex; justify-content: flex-end; align-items: center;
        gap: 3px; margin-top: 3px;
      }
      .bubble-time { font-size: 10px; color: #8696a0; white-space: nowrap; }
      .ticks { color: #53bdeb; font-size: 12px; }

      /* ── Typing ── */
      .typing-bubble {
        background: #1f2c34;
        border-top-left-radius: 0;
        padding: 12px 14px;
        display: inline-flex; gap: 4px; align-items: center;
        border-radius: 7.5px;
      }
      .typing-bubble span {
        width: 7px; height: 7px; border-radius: 50%;
        background: #8696a0; animation: blink 1.2s infinite;
      }
      .typing-bubble span:nth-child(2) { animation-delay: .2s; }
      .typing-bubble span:nth-child(3) { animation-delay: .4s; }
      @keyframes blink {
        0%,80%,100% { opacity: .3; transform: scale(1); }
        40%          { opacity: 1;  transform: scale(1.2); }
      }

      /* ── Input bar ── */
      .input-bar {
        background: #1f2c34;
        padding: 8px 10px;
        display: flex; align-items: flex-end; gap: 8px;
        flex-shrink: 0;
      }
      .input-bar > svg { width: 24px; height: 24px; fill: #8696a0; flex-shrink: 0; cursor: pointer; }
      .input-wrap {
        flex: 1; background: #2a3942; border-radius: 20px;
        display: flex; align-items: flex-end;
        padding: 7px 12px; gap: 8px;
      }
      .input-wrap textarea {
        flex: 1; background: transparent; border: none; outline: none;
        color: #e9edef; font-size: 14px; font-family: inherit;
        resize: none; max-height: 100px; line-height: 1.4; overflow-y: auto;
      }
      .input-wrap textarea::placeholder { color: #8696a0; }
      .input-wrap svg { fill: #8696a0; width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
      .send-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: #00a884; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; transition: background .15s;
      }
      .send-btn:hover  { background: #00c49a; }
      .send-btn:disabled { background: #2a3942; cursor: not-allowed; }
      .send-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 2px; }

      /* ── Home bar ── */
      .home-bar {
        background: #1f2c34;
        display: flex; justify-content: center;
        padding: 6px 0 10px; flex-shrink: 0;
      }
      .home-bar div { width: 120px; height: 4px; border-radius: 2px; background: #8696a0; opacity: .5; }

      @media (max-width: 420px) {
        .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="phone">

      <!-- Status bar -->
      <div class="status-bar">
        <span class="time" id="statusTime">9:41</span>
        <div class="status-icons">
          <svg viewBox="0 0 24 24"><rect x="2" y="15" width="3" height="6" rx=".5"/><rect x="7" y="11" width="3" height="10" rx=".5"/><rect x="12" y="7" width="3" height="14" rx=".5"/><rect x="17" y="3" width="3" height="18" rx=".5" opacity=".35"/></svg>
          <svg viewBox="0 0 24 24"><path d="M1.5 8.5a15 15 0 0121 0M5 12a11 11 0 0114 0M8.5 15.5a7 7 0 017 0M12 19h.01" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2" stroke="#fff" stroke-width="1.5" fill="none"/><rect x="3" y="8" width="13" height="8" rx="1.5" fill="#fff"/><path d="M20 10v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- WA Header -->
      <div class="wa-header">
        <span class="back-btn">‹</span>
        <div class="avatar">S</div>
        <div class="contact-info">
          <div class="contact-name">Staffable HR</div>
          <div class="contact-sub" id="agentStatus">online</div>
        </div>
        <div class="header-icons">
          <svg viewBox="0 0 24 24"><path d="M15 10l4.55-2.27A1 1 0 0121 8.7v6.6a1 1 0 01-1.45.91L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="#fff"/><circle cx="12" cy="12" r="1.5" fill="#fff"/><circle cx="12" cy="19" r="1.5" fill="#fff"/></svg>
        </div>
      </div>

      <!-- Chat body -->
      <div class="chat-body" id="chatBody">
        <div class="date-chip"><span id="todayLabel">VANDAAG</span></div>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="#8696a0" stroke-width="1.5" fill="none"/><path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#8696a0" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="9" cy="10" r="1" fill="#8696a0"/><circle cx="15" cy="10" r="1" fill="#8696a0"/></svg>
        <div class="input-wrap">
          <textarea id="msgInput" placeholder="Typ een bericht" rows="1"></textarea>
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="#8696a0" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        </div>
        <button class="send-btn" id="sendBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <!-- Home bar -->
      <div class="home-bar"><div></div></div>
    </div>

    <script>
      const chatBody    = document.getElementById('chatBody');
      const msgInput    = document.getElementById('msgInput');
      const sendBtn     = document.getElementById('sendBtn');
      const agentStatus = document.getElementById('agentStatus');

      // Live clock + Dutch date label
      const now = new Date();
      document.getElementById('statusTime').textContent =
        now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('todayLabel').textContent =
        now.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long' }).toUpperCase();

      function timeNow() {
        return new Date().toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit' });
      }

      function addBubble(text, type) {
        const row    = document.createElement('div');
        row.className = `msg-row ${type}`;
        const bubble  = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML =
          `<span>${text.replace(/\n/g,'<br>')}</span>` +
          `<div class="bubble-footer">` +
            `<span class="bubble-time">${timeNow()}</span>` +
            (type === 'user' ? '<span class="ticks">✓✓</span>' : '') +
          `</div>`;
        row.appendChild(bubble);
        chatBody.appendChild(row);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function showTyping() {
        const row = document.createElement('div');
        row.className = 'msg-row agent';
        row.id = 'typing-row';
        row.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
        chatBody.appendChild(row);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function removeTyping() {
        const el = document.getElementById('typing-row');
        if (el) el.remove();
      }

      async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        msgInput.value = '';
        msgInput.style.height = 'auto';
        sendBtn.disabled = true;
        addBubble(text, 'user');
        agentStatus.textContent = 'aan het typen…';
        showTyping();

        try {
          const res  = await fetch('/agent', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, from: 'local-user' })
          });
          const data = await res.json();
          removeTyping();
          agentStatus.textContent = 'online';
          addBubble(data.reply || data.output || data.text || data.message || 'Geen antwoord ontvangen.', 'agent');
        } catch {
          removeTyping();
          agentStatus.textContent = 'offline';
          addBubble('Kan de server niet bereiken. Controleer of de server actief is.', 'agent');
        } finally {
          sendBtn.disabled = false;
          msgInput.focus();
        }
      }

      // Auto-resize textarea
      msgInput.addEventListener('input', () => {
        msgInput.style.height = 'auto';
        msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
        sendBtn.disabled = msgInput.value.trim() === '';
      });

      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) sendMessage();
        }
      });

      sendBtn.addEventListener('click', sendMessage);

      // Welcome message
      setTimeout(() => {
        addBubble('Hallo! Ik ben uw HR-assistent van Staffable. Stel gerust uw vraag over salaris, verlof, contract of een ander HR-onderwerp.', 'agent');
      }, 500);
    </script>
  </body>
</html>
