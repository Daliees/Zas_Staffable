<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local HR Agent Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        height: 90vh;
        max-height: 700px;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: flex;
        animation: slideIn 0.3s ease-out;
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.agent {
        justify-content: flex-start;
      }

      .message-bubble {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 14px;
        line-height: 1.4;
        word-wrap: break-word;
      }

      .message.user .message-bubble {
        background: #667eea;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.agent .message-bubble {
        background: #e0e0e0;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .message.error .message-bubble {
        background: #ffebee;
        color: #c62828;
        border-bottom-left-radius: 4px;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 12px 16px;
      }

      .typing-indicator span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        animation: bounce 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%, 80%, 100% {
          opacity: 0.5;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-8px);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .input-container {
        padding: 16px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 10px;
      }

      .input-group {
        flex: 1;
        display: flex;
        gap: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 24px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus {
        border-color: #667eea;
      }

      button {
        padding: 12px 24px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover:not(:disabled) {
        background: #764ba2;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        padding: 8px 16px;
        font-size: 12px;
        color: #666;
        text-align: center;
        border-top: 1px solid #f0f0f0;
        background: #f9f9f9;
      }

      .status.error {
        color: #c62828;
        background: #ffebee;
      }

      .status.success {
        color: #2e7d32;
        background: #e8f5e9;
      }

      @media (max-width: 600px) {
        .container {
          height: 100vh;
          max-height: none;
          border-radius: 0;
        }

        .header {
          border-radius: 0;
        }

        .message-bubble {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>HR Agent Chat</h1>
        <p>Ask about benefits, PTO, payroll, and more</p>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="input-container">
        <div class="input-group">
          <input
            type="text"
            id="messageInput"
            placeholder="Type your question..."
            autocomplete="off"
          />
          <button id="sendButton">Send</button>
        </div>
      </div>

      <div class="status" id="status">Ready</div>
    </div>

    <script>
      const messagesContainer = document.getElementById("messagesContainer");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const statusEl = document.getElementById("status");

      function addMessage(text, type) {
        const messageEl = document.createElement("div");
        messageEl.className = `message ${type}`;

        const bubbleEl = document.createElement("div");
        bubbleEl.className = "message-bubble";
        bubbleEl.textContent = text;

        messageEl.appendChild(bubbleEl);
        messagesContainer.appendChild(messageEl);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function showTyping() {
        const messageEl = document.createElement("div");
        messageEl.className = "message agent";
        messageEl.id = "typing-indicator";

        const typingEl = document.createElement("div");
        typingEl.className = "typing-indicator";
        typingEl.innerHTML = "<span></span><span></span><span></span>";

        messageEl.appendChild(typingEl);
        messagesContainer.appendChild(messageEl);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function removeTyping() {
        const typingEl = document.getElementById("typing-indicator");
        if (typingEl) {
          typingEl.remove();
        }
      }

      function setStatus(text, type = "info") {
        statusEl.textContent = text;
        statusEl.className = `status ${type}`;
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        // Clear input and add user message
        messageInput.value = "";
        addMessage(text, "user");
        sendButton.disabled = true;
        showTyping();
        setStatus("Waiting for response...", "info");

        try {
          const response = await fetch("/agent", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: text,
              from: "local-user"
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();
          removeTyping();

          const reply =
            data.output ||
            data.text ||
            data.message ||
            data.reply ||
            "I didn't understand that. Could you rephrase?";
          addMessage(reply, "agent");
          setStatus("Response received", "success");
        } catch (error) {
          removeTyping();
          addMessage(
            `Error: ${error.message}. Make sure the server is running.`,
            "error"
          );
          setStatus(`Error: ${error.message}`, "error");
        } finally {
          sendButton.disabled = false;
          messageInput.focus();
        }
      }

      sendButton.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Focus input on load
      window.addEventListener("load", () => {
        messageInput.focus();
        addMessage("Hello! I'm your HR Assistant. Ask me about benefits, PTO, payroll, or anything HR-related.", "agent");
      });
    </script>
  </body>
</html>
